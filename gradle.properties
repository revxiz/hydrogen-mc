org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false

mod_id=hydrogen
mod_name=Hydrogen
mod_version=1.2.0
maven_group=dev.hydrogen
mod_description=Hardware-aware CPU scheduling, adaptive VRAM and render scaling, and motion-aware chunk ordering. Every threshold is measured on your machine at runtime.
mod_authors=Hydrogen contributors
mod_license=MIT
mod_source=https://github.com/revxiz/hydrogen-mc
mod_issues=https://github.com/revxiz/hydrogen-mc/issues

# Build tools
loom_version=1.18.2
moddev_version=2.0.148
forgegradle_version=7.0.40

# Loaders compiled against. The jars accept older loaders, see versions/*/mc.properties.
fabric_loader_version=0.19.5
quilt_loader_version=0.30.1
# Mixin that Fabric and Quilt mixins compile against: the one Fabric Loader 0.16.0
# ships. See gradle/loaders/loom.gradle.
compile_mixin_version=0.15.0+mixin.0.8.7

# Remote console the jars point at (an https address, no trailing slash). Empty
# means this build has none; players can still set console.url in
# config/hydrogen.properties.
console_url=
