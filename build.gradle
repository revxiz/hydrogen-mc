plugins {
	id 'base'
}

allprojects {
	group = project.maven_group
	version = project.mod_version
}

def loaderProjects = subprojects.findAll { it.name != 'core' }

// Collects every finished loader jar into build/dist, one file per loader and
// Minecraft branch, ready for a release.
def collectJars = tasks.register('collectJars', Sync) {
	group = 'build'
	description = 'Builds every loader and Minecraft branch and gathers the jars in build/dist.'
	into layout.buildDirectory.dir('dist')
}

// Each loader script exposes its final (remapped or reobfuscated) jar as
// `hydrogenJar`; wire them up once every project has been configured.
gradle.projectsEvaluated {
	collectJars.configure { task ->
		loaderProjects.each { p ->
			if (p.ext.has('hydrogenJar')) {
				task.from(p.ext.hydrogenJar)
			}
		}
	}
}

// Narrow either task with -Ploader=fabric,quilt and -Pmc=1.21.1; see settings.gradle.
tasks.register('publishLoader') {
	group = 'publishing'
	description = 'Publishes every included loader jar to GitHub Packages.'
	loaderProjects.each { p ->
		dependsOn "${p.path}:publishAllPublicationsToGitHubPackagesRepository"
	}
}
