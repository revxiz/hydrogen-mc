# Minecraft 26.3. Unobfuscated, Java 25. Rendering moved onto Mojang's renderpearl
# layer, which has both an OpenGL and a Vulkan backend, and the window moved from
# GLFW to SDL3.
minecraft_version=26.3
java_version=25
obfuscated=false
render_group=mcmodern
window_api=sdl
# Forge 26.x still ships Mixin 0.8.7, which knows levels up to JAVA_21.
mixin_compat=JAVA_21
# Data pack format, which Forge reads from pack.mcmeta in mod jars.
mod_pack_format=121

fabric_mc_range=>=26.3 <26.4
fabric_loader_min=0.19.3
quilt_loader_min=0.30.1

forge_version=66.0.9
forge_loader_range=[66,)
forge_mc_range=[26.3,26.4)

neoforge_version=26.3.0.46-beta
neoforge_dep_range=[26.3.0.0-beta,)
