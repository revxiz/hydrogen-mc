# Minecraft 1.20.x branch. OpenGL render targets, Java 17.
minecraft_version=1.20.1
java_version=17
obfuscated=true
render_group=mclegacy
window_api=glfw
mixin_compat=JAVA_17
# Data pack format, which Forge reads from pack.mcmeta in mod jars.
mod_pack_format=15

fabric_mc_range=>=1.20 <1.20.5
fabric_loader_min=0.16.0
quilt_loader_min=0.26.0

# Forge 47 also covers NeoForge 1.20.1, which is the same loader under a new name.
forge_version=47.4.26
forge_loader_range=[47,)
forge_mc_range=[1.20.1,1.20.2)
