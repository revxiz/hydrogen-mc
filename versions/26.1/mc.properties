# Minecraft 26.1 to 26.1.2. Unobfuscated, Blaze3D, Java 25. Same client
# surface as 1.21.11: the main target still lives on Minecraft.
minecraft_version=26.1.2
java_version=25
obfuscated=false
render_group=mcmodern
window_api=glfw
# Forge 26.x still ships Mixin 0.8.7, which knows levels up to JAVA_21. The level
# only gates mixin language features; Java 25 class files load fine.
mixin_compat=JAVA_21
# Data pack format, which Forge reads from pack.mcmeta in mod jars.
mod_pack_format=101

fabric_mc_range=>=26.1 <26.2
fabric_loader_min=0.19.3
quilt_loader_min=0.30.1

forge_version=64.1.3
forge_loader_range=[64,)
forge_mc_range=[26.1.2,26.1.3)

neoforge_version=26.1.2.114
neoforge_dep_range=[26.1.2.0,)
