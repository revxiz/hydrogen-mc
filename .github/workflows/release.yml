name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, for example v1.1.0'
        required: true
        default: 'v1.1.0'

permissions:
  contents: read

jobs:
  jars:
    name: ${{ matrix.loader }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        loader: [fabric, quilt, forge, neoforge]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - uses: gradle/actions/setup-gradle@v5

      - name: Build every ${{ matrix.loader }} jar
        run: ./gradlew collectJars -Ploader=${{ matrix.loader }} --no-daemon

      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./gradlew publishLoader -Ploader=${{ matrix.loader }} --no-daemon

      - uses: actions/upload-artifact@v5
        with:
          name: hydrogen-${{ matrix.loader }}
          path: build/dist/*.jar
          if-no-files-found: error

  release:
    needs: jars
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: hydrogen-*
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Hydrogen ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*.jar
          body: |
            Built by CI from this commit. One jar per loader and Minecraft branch,
            named `hydrogen-<loader>-<minecraft>-<version>.jar`.

            | Minecraft | Fabric | Quilt | Forge | NeoForge |
            |---|---|---|---|---|
            | 1.20.1 | yes | yes | yes | use the Forge jar |
            | 1.21.1 | yes | yes | yes | yes |
            | 1.21.11 | yes | yes | yes | yes |
            | 26.1.2 | yes | yes | yes | yes |
            | 26.2 | yes | yes | yes | yes |
            | 26.3 | yes | yes | yes | yes (beta loader) |

            No dependencies. Fabric API, Quilt Standard Libraries and any
            config library are not needed.
