name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 25 compiles every branch; older ones use --release 17 and 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build all branches
        run: ./gradlew collectJars --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: hydrogen-jars
          path: build/dist/*.jar
          if-no-files-found: error
