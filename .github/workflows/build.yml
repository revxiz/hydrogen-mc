name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            25

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: ./gradlew :core:test --no-daemon

  jars:
    name: ${{ matrix.loader }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, quilt, forge, neoforge]
    steps:
      - uses: actions/checkout@v5

      # Each branch compiles with its own toolchain: 17 for 1.20.x, 21 for 1.21.x,
      # 25 for 26.x. Gradle itself runs on 25, so it is listed last.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - uses: gradle/actions/setup-gradle@v5

      - name: Build every ${{ matrix.loader }} jar
        run: ./gradlew collectJars -Ploader=${{ matrix.loader }} --no-daemon

      - uses: actions/upload-artifact@v5
        with:
          name: hydrogen-${{ matrix.loader }}
          path: build/dist/*.jar
          if-no-files-found: error
