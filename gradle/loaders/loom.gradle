// Shared by the Fabric and Quilt projects, both built with Fabric Loom.
// Obfuscated Minecraft (before 26.1) uses the remapping Loom plugin and Mojang
// mappings; 26.x ships unobfuscated.
dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"

	if (isObfuscated) {
		mappings loom.officialMojangMappings()
		modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
	} else {
		implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
	}
}

// Mixin 0.17.4 (Fabric Loader 0.19.5) declares @Redirect's `at` as an array,
// and javac stores the annotation in whatever shape the compile classpath says.
// Older runtimes (Fabric Loader 0.16 to 0.19.4, Quilt Loader 0.30) cannot read
// the array form, while every newer one still reads the single form. So mixins
// compile against the Mixin of the oldest loader the metadata accepts.
configurations.named('compileClasspath') {
	resolutionStrategy.force "net.fabricmc:sponge-mixin:${rootProject.compile_mixin_version}"
}

ext.hydrogenJar = isObfuscated ? tasks.named('remapJar') : tasks.named('jar')
